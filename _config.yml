# GitHub Pages build configuration.
#
# WHY THIS FILE EXISTS. Pages build #190 failed: the build step passed in 24
# seconds and the DEPLOY step ran for 10m 10s and then errored. The repository
# was publishing 20 MB across 223 files, and 12 MB of that was `mock/` - the
# build scratch. Eight abandoned landing-page mockups at roughly 620 KB each,
# plus checked-in build outputs that duplicate pages already live at the root.
#
# The actual site is about 7 MB across ~70 files. Everything else was being
# packaged into the deployment artifact for no reason, and the deploy step was
# timing out on it.
#
# It was also being SERVED. Before this file,
# https://cavatello.github.io/therapist-tools/mock/amft/build_advisor.py
# returned 200 - the Python that builds the job advisor was publicly readable,
# as were every abandoned mockup and the package manifest.
#
# WHY EXCLUDE RATHER THAN DELETE. `mock/` and `_dev/` are the build tooling and
# they belong in version control - the .gitignore already carries a note about
# an earlier mistake where `_dev/` was ignored wholesale and the tooling was
# lost. Excluding them from the published site keeps both properties: versioned
# in git, absent from the web.
#
# NOTE ON JEKYLL DEFAULTS. Setting `exclude` REPLACES Jekyll's built-in list
# rather than adding to it, so the defaults worth keeping (node_modules,
# Gemfile, vendor) are repeated here explicitly. Leaving them out would have
# quietly started publishing node_modules the moment someone ran npm install.
#
# Directories beginning with an underscore are excluded by Jekyll anyway, which
# is why `_dev/` already 404s. It is listed regardless, so the rule survives
# anyone ever adding a .nojekyll file - which would disable Jekyll entirely and
# start serving it.
#
# Nothing here changes how a page is built. None of the site's HTML carries
# YAML front matter, so Jekyll copies every page verbatim; this file only
# decides what gets copied.

exclude:
  # build tooling and scratch - versioned, not published
  - mock/
  - _dev/
  - _to_delete/
  - _publish/

  # repo furniture
  - README.md
  - README-HANDOFF.md
  - package.json
  - package-lock.json
  - .DS_Store

  # Jekyll's own defaults, repeated because `exclude` replaces them
  - node_modules/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
