<html lang="en">

<title>Prototype 2 — The Lie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--ink:#2A2018;--muted:#7C6B57;--paper:#FDF7EA;--line:#DAC7A4;--gold:#E0A526;
  --good:#4E8C5B;--bad:#B5483F;--terra:#C4633F;--plum:#7A4A6B;}
*{box-sizing:border-box;}
body{margin:0;background:#241A12;color:var(--ink);font-family:'Karla',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
button{font-family:'Karla',sans-serif;cursor:pointer;}
.app{max-width:1120px;margin:0 auto;}
.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#160F09;padding:9px 16px;border-bottom:2px solid #3B2A1C;}
.nav .l{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#8A7359;font-weight:800;}
.nav a{font-size:12px;font-weight:700;text-decoration:none;color:#D6C6AC;padding:5px 11px;border-radius:7px;border:1px solid #45321F;}
.nav a.on{background:var(--gold);color:#3A2705;border-color:var(--gold);}
.bar{display:flex;align-items:center;gap:14px;padding:11px 16px;background:#1A120C;flex-wrap:wrap;}
.logo{font-family:'Baloo 2',cursive;font-weight:800;font-size:18px;color:var(--gold);}
.logo small{display:block;font-family:'Karla';font-size:9px;font-weight:700;color:#8A7359;letter-spacing:.16em;text-transform:uppercase;margin-top:-2px;}

/* the thread rail — the whole point of the design, so it's always visible */
.threads{margin-left:auto;display:flex;gap:7px;flex-wrap:wrap;align-items:center;}
.threads .lb{font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#8A7359;font-weight:800;}
.th{background:#2A1D13;border:1px solid #45321F;border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:#C4AE8C;}
.th.live{border-color:#8A5A2B;color:#F0C048;background:#3A2A0C;}
.th.hot{border-color:var(--bad);color:#FFC9C9;background:#3A1414;animation:pl 1.4s infinite;}
.th.dead{opacity:.4;text-decoration:line-through;}
@keyframes pl{50%{box-shadow:0 0 0 3px rgba(181,72,63,.22);}}

.acts{display:flex;gap:0;background:#1F160E;padding:0 16px 12px;}
.act{flex:1;padding:9px 12px;border-bottom:3px solid #3B2A1C;font-size:11px;font-weight:800;
  text-transform:uppercase;letter-spacing:.11em;color:#6E5A44;}
.act.on{border-bottom-color:var(--gold);color:#F3E4C8;}
.act.done{border-bottom-color:#5E4A2C;color:#A08A6C;}

.stage{position:relative;width:100%;aspect-ratio:1000/460;overflow:hidden;background:#E8D6B6;
  border-top:2px solid #3B2A1C;border-bottom:2px solid #3B2A1C;}
.stage svg.room{position:absolute;inset:0;width:100%;height:100%;}
.person{position:absolute;bottom:10%;transition:left .8s ease,filter .4s,opacity .4s;}
.person svg{width:100%;height:auto;display:block;filter:drop-shadow(0 4px 5px rgba(60,35,15,.28));}
.person .np{position:absolute;bottom:-15px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:8.5px;
  font-weight:800;color:#4A3722;background:rgba(255,248,232,.94);padding:1px 6px;border-radius:9px;border:1px solid rgba(120,95,60,.25);}
.person.low .np{bottom:-27px;}
.person.dim{filter:grayscale(.7) brightness(.82) drop-shadow(0 4px 5px rgba(60,35,15,.2));opacity:.72;}
.person.spot{z-index:20;}
.person.spot:before{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);
  width:150%;height:18px;border-radius:50%;background:radial-gradient(ellipse,rgba(224,165,38,.55),transparent 70%);}
.pop{position:absolute;bottom:106%;left:50%;transform:translateX(-50%);background:#fff;border:2.5px solid var(--ink);
  border-radius:12px;padding:8px 11px;font-size:12px;font-weight:700;line-height:1.4;width:210px;text-align:center;
  box-shadow:3px 3px 0 rgba(42,32,24,.22);z-index:30;}
.pop:after{content:"";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);border:9px solid transparent;border-top-color:var(--ink);border-bottom:0;}
.pop:before{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0;z-index:1;}
.tag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;
  background:var(--terra);color:#fff;padding:2px 7px;border-radius:8px;white-space:nowrap;letter-spacing:.05em;}

.panel{background:var(--paper);padding:16px 18px 20px;}
.who{font-family:'Baloo 2',cursive;font-weight:700;font-size:20px;margin-bottom:3px;}
.who span{font-family:'Karla';font-size:11.5px;font-weight:700;color:var(--muted);background:#EFE3CB;
  padding:2px 9px;border-radius:20px;margin-left:8px;vertical-align:middle;}
.line{font-size:16.5px;line-height:1.62;margin:8px 0 16px;max-width:72ch;}
.opts{display:grid;gap:9px;}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;background:#fff;border:2px solid var(--line);
  border-radius:12px;padding:12px 14px;font-size:14.5px;font-weight:600;color:var(--ink);transition:transform .12s,border-color .12s;}
.opt:hover{border-color:var(--ink);transform:translateX(3px);}
.opt .tg{flex:none;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:6px;margin-top:1px;}
.tg-true{background:#DDEAF2;color:#2E6E8E;}
.tg-lie{background:#F6DFDA;color:#9B3A2E;}
.tg-double{background:#F3D9C4;color:#8A4A12;}
.opt .cost{margin-left:auto;font-size:10.5px;font-weight:800;color:var(--muted);white-space:nowrap;flex:none;}
.rules{font-size:12.5px;color:var(--muted);line-height:1.65;margin:14px 0 0;max-width:82ch;}
.rules b{color:var(--ink);}
.big{font-family:'Baloo 2',cursive;font-weight:700;font-size:16px;padding:12px 22px;border-radius:12px;
  border:2.5px solid var(--ink);background:var(--gold);color:#3A2705;box-shadow:0 4px 0 var(--ink);}
.big.go{background:var(--good);color:#fff;}
.big:hover{transform:translateY(2px);box-shadow:0 2px 0 var(--ink);}
.modal{position:fixed;inset:0;background:rgba(26,18,12,.88);z-index:90;display:none;align-items:center;justify-content:center;padding:20px;}
.modal.open{display:flex;}
.mb{background:var(--paper);border:3px solid var(--ink);border-radius:18px;padding:26px 28px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;}
.mb h2{font-family:'Baloo 2',cursive;font-size:27px;margin:0 0 3px;}
.mb .ep{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--terra);margin-bottom:14px;}
.beat{background:#fff;border:2px solid var(--line);border-left:5px solid var(--terra);border-radius:0 11px 11px 0;
  padding:12px 15px;font-size:14.5px;line-height:1.6;margin-bottom:10px;}
.beat.combo{border-left-color:var(--plum);background:#FBF4F8;}
.beat .cl{display:block;font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--plum);margin-bottom:5px;}
.mb .fin{font-size:15.5px;line-height:1.7;font-style:italic;margin:16px 0;}
.mb .big{width:100%;}
</style>
</head>

+'<ellipse cx="843" cy="280" rx="12" ry="6" fill="#E8926F"/><ellipse cx="866" cy="279" rx="13" ry="6" fill="#E8926F"/>'
+'<g fill="#D9A45E" stroke="#A9762F" stroke-width="2"><circle cx="900" cy="278" r="11"/><circle cx="918" cy="281" r="10"/></g>'
+'<rect x="944" y="248" width="16" height="38" rx="4" fill="#6E2233"/><rect x="948" y="238" width="8" height="14" fill="#6E2233"/>'
+'<rect x="944" y="262" width="16" height="14" fill="#D9C08A"/>'
+'<path d="M922 262 h18 l-3 14 h-12 Z" fill="#E0A526" stroke="#8A6100" stroke-width="2"/>'
+'<rect x="928" y="276" width="6" height="8" fill="#E0A526"/><rect x="922" y="284" width="18" height="4" rx="2" fill="#E0A526"/>'
+'<g stroke="#6E4E2C" stroke-width="5" fill="none"><path d="M700 350 V206"/><path d="M684 214 L700 206 L716 214"/><path d="M690 350 h20"/></g>'
+'<g opacity=".95"><path d="M700 216 q22 4 22 30 q0 28 -22 28 q-22 0 -22 -28 q0 -26 22 -30 Z" fill="#3E5A72"/>'
+'<path d="M700 216 v58" stroke="#2C4152" stroke-width="2.5"/><circle cx="700" cy="232" r="2.5" fill="#C8B18B"/></g>'
+'</svg>';

var MOHEL_ART={skin:"#EFC49B",coat:"#4A4A56",pants:"#33333E",hair:"bald",hairCol:"#B9B2AA",
  glasses:true,kippah:"#4A2F86",mood:"annoyed",doctorbag:true};

var CAST=[
 {id:"marv",  name:"Uncle Marv",     w:8.6, art:{skin:SKINS[1],coat:"#5A4636",pants:"#3A3128",hair:"bald",hairCol:"#8A8078",mood:"smug",kippah:"#3A3A6E"}},
 {id:"bubbe", name:"The Bubbe",      w:6.3, art:{skin:SKINS[4],coat:"#7A4A6B",pants:"#5E3A52",hair:"wig",hairCol:"#C9C2BA",mood:"annoyed",bag:true}},
 {id:"rav",   name:"Rabbi Feld",     w:7.6, art:{skin:SKINS[2],coat:"#2C2C38",pants:"#22222C",hair:"dark",hairCol:"#4A4038",beard:true,beardCol:"#6E6258",hat:true,mood:"neutral"}},
 {id:"cater", name:"The caterer",    w:7.4, art:{skin:SKINS[3],coat:"#4E6E62",pants:"#33413B",hair:"dark",hairCol:"#2E2620",apron:true,tray:true,mood:"annoyed"}},
 {id:"cousin",name:"Cousin Sheldon", w:7.9, art:{skin:SKINS[0],coat:"#6E7F42",pants:"#414C28",hair:"dark",hairCol:"#5A4636",glasses:true,mood:"smug",kippah:"#7A2A2A"}},
 {id:"neigh", name:"Gary next door", w:7.2, art:{skin:SKINS[1],coat:"#8A5A2B",pants:"#4E3A24",hair:"gray",hairCol:"#9A9088",phone:true,mood:"neutral"}},
 {id:"aunt",  name:"Aunt Roz",       w:6.7, art:{skin:SKINS[4],coat:"#C4633F",pants:"#8A4028",hair:"bun",hairCol:"#8A6A4A",mood:"happy",bag:true}}
];
var FAMILIES=["Reznick","Abramowitz","Sharfstein","Glick","Mandelbaum","Perlmutter","Ostrofsky","Berkowitz","Zilberman","Nussbaum"];

function el(html){var d=document.createElement("div");d.innerHTML=html;return d.firstElementChild;}

return {rnd:rnd,ri:ri,pick:pick,shuffle:shuffle,reseed:reseed,personSVG:personSVG,babySVG:babySVG,
        ROOM_SVG:ROOM_SVG,CAST:CAST,MOHEL_ART:MOHEL_ART,FAMILIES:FAMILIES,SKINS:SKINS,el:el};
})();

</script>
<script>
(function(){
"use strict";
var stage=document.getElementById("stage"), panel=document.getElementById("panel"), el=MO.el;

/* ---------- the six threads ----------
   Each is a small social lie that is free now and expensive in act three. */
var SETUPS=[
{id:"driveway",who:"marv",tag:"the driveway",
 line:"“I’m in the driveway. I’m not blocking anybody. Am I blocking anybody? Look at me and tell me I’m blocking somebody.”",
 opts:[
  {k:"true", text:"“You’re blocking the rabbi.”", cost:"−room now", reply:"He moves it. Badly. But he moves it."},
  {k:"lie",  text:"“You’re fine.”", cost:"free now", reply:"“Thank you. Finally. A reasonable man.”"}]},

{id:"deluxe",who:"cater",tag:"the platter",
 line:"“Confirm for me that this is what you ordered, because the wife of the house is giving me a look.”",
 opts:[
  {k:"true", text:"“It’s missing about half of it.”", cost:"−room now", reply:"He gets on the phone to the van. Loudly."},
  {k:"lie",  text:"“That’s the one.”", cost:"free now", reply:"He puts it down like a man vindicated."}]},

{id:"nephew",who:"aunt",tag:"her nephew",
 line:"“You did my nephew. Sherman Oaks. Two thousand nineteen. You remember.”",
 opts:[
  {k:"true", text:"“I really don’t.”", cost:"−room now", reply:"A pause you could park a car in."},
  {k:"lie",  text:"“Of course. How is he?”", cost:"free now", reply:"“He’s WONDERFUL. Wait till you see him.”"}]},

{id:"quick",who:"rav",tag:"two minutes",
 line:"“Give me a realistic number. I have somewhere to be and I would like to plan my life around it.”",
 opts:[
  {k:"true", text:"“Forty minutes, realistically.”", cost:"−room now", reply:"He sits down heavily and takes out a book."},
  {k:"lie",  text:"“Two minutes.”", cost:"free now", reply:"He does not sit down. He keeps his coat on."}]},

{id:"fee",who:"cousin",tag:"the money",
 line:"“Between us. What’s the number. I’m asking because I’m the one who told them to call you.”",
 opts:[
  {k:"true", text:"Tell him the number.", cost:"−room now", reply:"“Hm. Okay. Hm.” He says nothing else, forever."},
  {k:"lie",  text:"“We’re not worrying about that today.”", cost:"free now", reply:"“Not worrying about it. Love that. LOVE that.”"}]},

{id:"chair",who:"bubbe",tag:"the chair",
 line:"“The chair faces the television. Elijah does not watch television. Will you turn it or will I.”",
 opts:[
  {k:"true", text:"Turn the chair, now, in front of her.", cost:"−room now", reply:"“Good. Now the other way slightly.”"},
  {k:"lie",  text:"“I’ll take care of it.”", cost:"free now", reply:"“You’re a good boy.” You do not take care of it."}]}
];

/* act two: the thread gets tested */
var TESTS={
 driveway:{who:"rav",line:"“Whose car is behind mine. Somebody said you handled the cars.”",
   dd:"“Nobody’s behind you.”", dr:"He goes to look. He comes back. He looks at you differently.",
   cf:"“Marv’s. I’ll get him.”", cr:"You get Marv. It takes four minutes and everyone watches."},
 deluxe:{who:"bubbe",line:"“There’s no fish on that platter. Somebody signed for that platter.”",
   dd:"“That’s the platter they sent.”", dr:"“Somebody signed for it,” she says again, to the room.",
   cf:"“It’s wrong. I said it was fine and it isn’t.”", cr:"She likes you more. She also now tells everyone."},
 nephew:{who:"aunt",line:"“He’s here! He came! Should I bring him over — he’ll be so glad to see you.”",
   dd:"“Bring him over.”", dr:"You have committed. He is walking toward you at speed.",
   cf:"“Roz. I don’t think it was me.”", cr:"“…Oh.” She is quiet for the first time all morning."},
 quick:{who:"rav",line:"“It has been eleven minutes since your two minutes.”",
   dd:"“Two more.”", dr:"He writes something down. He wants you to see him write it.",
   cf:"“I lowballed you. It’s another half hour.”", cr:"He sits, and forgives you, and never fully forgets."},
 fee:{who:"cousin",line:"“I told the father you two had an arrangement. That’s right, isn’t it?”",
   dd:"“Something like that.”", dr:"“Great. Great. I’ll let him know it’s handled.”",
   cf:"“There’s no arrangement. There’s a normal fee.”", cr:"“Then why did you say—” He stops. He remembers it differently now."},
 chair:{who:"bubbe",line:"“The chair.”",
   dd:"“It’s turned.”", dr:"She does not go and look. She simply files it.",
   cf:"“I didn’t turn it. I’ll turn it now.”", cr:"She watches you turn it. It takes a long time."}
};

/* act three: what each live thread does when the room is full */
var PAYOFF={
 driveway:"The rabbi cannot leave. Marv’s car is behind his. Marv is inside, eating, and has been described to the room as “the one who parked.”",
 deluxe:"Somebody asks, at volume, where the fish is. The caterer, who is already at the door, points directly at you and leaves.",
 nephew:"Roz brings the nephew over. He is twenty-six. He has never seen you before in his life and he says so, warmly, twice.",
 quick:"You are at minute forty. The rabbi is standing with his coat on, looking at you the way a man looks at somebody who said two minutes.",
 fee:"The father announces, with real gratitude, in front of everyone, that you told him not to worry about the money.",
 chair:"The Bubbe goes to the chair. The chair has not moved. She does not say anything. She just finds your eyes from across the entire room and holds them."
};
/* the actual joy: threads colliding with each other */
var COMBO={
 "driveway|quick":"The rabbi decides to leave early. He cannot. It’s Marv’s car. Marv is asleep on the sofa with a plate on his chest.",
 "deluxe|fee":"The father is telling a circle of people what the spread cost, and then, in the same breath and the same tone, what you cost.",
 "chair|nephew":"Roz’s nephew helpfully offers to turn the chair. The Bubbe asks, very slowly, how he knows about the chair.",
 "driveway|fee":"Marv gives the room his valuation of the parking spot, and then, unprompted, his valuation of you.",
 "chair|deluxe":"The Bubbe and the caterer discover they have the same complaint, which is you. They are now, unbelievably, friends.",
 "nephew|quick":"Roz wants a photograph of you and the nephew. The rabbi is holding his coat. The nephew has questions.",
 "fee|quick":"The rabbi, leaving, asks the father what he paid. The father tells him nothing. The rabbi looks back at you.",
 "chair|driveway":"To turn the chair you have to move Marv. To move Marv you have to discuss the driveway. In front of the Bubbe.",
 "deluxe|nephew":"The nephew, being helpful, tells everyone the fish is missing. Roz says you’d know, you’ve been doing this for years — since his, in fact.",
 "chair|fee":"The Bubbe asks the father what he’s paying a man who couldn’t turn a chair.",
 "deluxe|quick":"The caterer needs a signature. The rabbi needs to leave. You are being handed a pen.",
 "nephew|fee":"“He did my nephew,” Roz tells the father, “and he didn’t charge a thing.” This is now two lies wearing one coat."
};

var G;
function reset(){
  MO.reseed(20260729+Math.floor(Date.now?0:0));
  G={act:1, i:0, threads:{}, room:60, setups:MO.shuffle(SETUPS).slice(0,4), tests:[], ti:0, cast:[]};
  var need={}; G.setups.forEach(function(s){need[s.who]=1;});
  MO.CAST.forEach(function(c){ if(need[c.id]) G.cast.push(c); });
  MO.CAST.forEach(function(c){ if(!need[c.id]&&G.cast.length<6) G.cast.push(c); });
  drawScene(); drawThreads(); markActs();
  document.getElementById("modal").classList.remove("open");
  step();
}

function drawScene(){
  stage.innerHTML=MO.ROOM_SVG;
  var n=G.cast.length, step=(86-30)/Math.max(1,n-1);
  G.cast.forEach(function(c,i){
    c.x=30+step*i;
    stage.appendChild(el('<div class="person'+(i%2?" low":"")+'" id="p-'+c.id+'" style="left:'+c.x+'%;width:'+c.w+'%;'
      +'bottom:'+(i%2?7:11)+'%;z-index:'+(i%2?11:9)+';">'+MO.personSVG(c.art)+'<div class="np">'+c.name+'</div></div>'));
  });
  stage.appendChild(el('<div class="person" id="p-mohel" style="left:13%;width:8.2%;bottom:10%;z-index:16;">'
    +MO.personSVG(MO.MOHEL_ART)+'<div class="np">You</div></div>'));
}
function spot(id){
  Array.prototype.slice.call(stage.querySelectorAll(".person")).forEach(function(p){
    p.classList.remove("spot"); if(p.id!=="p-mohel") p.classList.add("dim");
  });
  var t=document.getElementById("p-"+id);
  if(t){ t.classList.remove("dim"); t.classList.add("spot");
    var c=G.cast.filter(function(x){return x.id===id;})[0];
    if(c) document.getElementById("p-mohel").style.left=Math.max(8,c.x-11)+"%";
  }
}
function pop(id,txt,ms){
  Array.prototype.slice.call(stage.querySelectorAll(".pop")).forEach(function(p){p.remove();});
  var h=document.getElementById("p-"+id); if(!h) return;
  var b=el('<div class="pop">'+txt+'</div>'); h.appendChild(b);
  setTimeout(function(){ if(b.parentNode) b.remove(); }, ms||3600);
}
function tagOn(id,txt){
  var h=document.getElementById("p-"+id); if(!h) return;
  var old=h.querySelector(".tag"); if(old) old.remove();
  h.appendChild(el('<div class="tag">'+txt+'</div>'));
}
function drawThreads(){
  var box=document.getElementById("threads");
  box.innerHTML='<span class="lb">Loose ends</span>';
  var any=false;
  SETUPS.forEach(function(s){
    var t=G.threads[s.id]; if(!t) return; any=true;
    box.appendChild(el('<span class="th '+(t.state==="dead"?"dead":t.state==="hot"?"hot":"live")+'">'+s.tag+'</span>'));
  });
  if(!any) box.appendChild(el('<span class="th">none yet</span>'));
}
function markActs(){
  [1,2,3].forEach(function(i){
    var n=document.getElementById("a"+i);
    n.className="act"+(G.act===i?" on":G.act>i?" done":"");
  });
}

function step(){
  markActs();
  if(G.act===1){
    if(G.i>=G.setups.length){ G.act=2; buildTests(); return step(); }
    var s=G.setups[G.i];
    spot(s.who);
    render(s.who,s.tag,s.line,s.opts.map(function(o){
      return {k:o.k,text:o.text,cost:o.cost,go:function(){
        pop(s.who,o.reply);
        if(o.k==="lie"){ G.threads[s.id]={state:"live"}; tagOn(s.who,"you told him it was fine"); G.room+=4; }
        else { G.room-=7; }
        G.i++; drawThreads(); setTimeout(step,900);
      }};
    }));
  } else if(G.act===2){
    if(G.ti>=G.tests.length){ G.act=3; return setTimeout(finale,700); }
    var id=G.tests[G.ti], t=TESTS[id], s2=SETUPS.filter(function(x){return x.id===id;})[0];
    spot(t.who);
    render(t.who,"it comes up again — "+s2.tag,t.line,[
      {k:"double",text:t.dd,cost:"free now · it gets worse",go:function(){
        pop(t.who,t.dr); G.threads[id].state="hot"; G.room+=3; G.ti++; drawThreads(); setTimeout(step,1000);}},
      {k:"true",text:t.cf,cost:"−room now · it goes away",go:function(){
        pop(t.who,t.cr); G.threads[id].state="dead"; G.room-=9; G.ti++; drawThreads(); setTimeout(step,1000);}}
    ]);
  }
}
function buildTests(){
  var live=Object.keys(G.threads).filter(function(k){return G.threads[k].state==="live";});
  G.tests=MO.shuffle(live).slice(0,Math.min(2,live.length));
}

function render(who,tag,line,opts){
  var c=G.cast.filter(function(x){return x.id===who;})[0];
  var h='<div class="who">'+(c?c.name:"They")+'<span>'+tag+'</span></div><p class="line">'+line+'</p><div class="opts">';
  opts.forEach(function(o,i){
    h+='<button class="opt" data-i="'+i+'"><span class="tg tg-'+(o.k==="true"?"true":o.k==="double"?"double":"lie")+'">'
      +(o.k==="true"?"the truth":o.k==="double"?"double down":"the easy thing")+'</span><span>'+o.text+'</span>'
      +'<span class="cost">'+o.cost+'</span></button>';
  });
  h+='</div><p class="rules"><b>The easy thing is free right now.</b> It becomes a loose end, and loose ends do not stay '
    +'in the corner you left them in — in act three they find each other. Telling the truth costs you the room immediately '
    +'and buys you nothing you can see. That is the entire bet.</p>';
  panel.innerHTML=h;
  Array.prototype.slice.call(panel.querySelectorAll(".opt")).forEach(function(b,i){
    b.addEventListener("click",function(){ opts[i].go(); });
  });
}

function finale(){
  markActs();
  Array.prototype.slice.call(stage.querySelectorAll(".person")).forEach(function(p){p.classList.remove("dim","spot");});
  var n=G.cast.length, sp=(84-40)/Math.max(1,n-1);
  G.cast.forEach(function(c,i){ var e=document.getElementById("p-"+c.id); if(e) e.style.left=(40+sp*i)+"%"; });
  document.getElementById("p-mohel").style.left="26%";
  panel.innerHTML='<div class="who">Act three<span>everyone is in the same room</span></div>'
    +'<p class="line">The kitchen empties out. Everybody you spoke to this morning is now standing within four feet of everybody else you spoke to this morning.</p>';

  var live=Object.keys(G.threads).filter(function(k){return G.threads[k].state!=="dead";});
  var hot=live.filter(function(k){return G.threads[k].state==="hot";});
  var beats=[];
  live.forEach(function(k){ beats.push({t:"single",text:PAYOFF[k]}); });
  var combos=[];
  for(var i=0;i<live.length;i++)for(var j=i+1;j<live.length;j++){
    var ck=[live[i],live[j]].sort().join("|");
    if(COMBO[ck]) combos.push({t:"combo",text:COMBO[ck]});
  }
  beats=beats.concat(combos);

  var title,ep,fin;
  if(!live.length){ title="A quiet morning"; ep="nothing came back";
    fin="You told four people something they did not want to hear and the morning was, as a result, completely uneventful. Nobody will remember it. You will."; }
  else if(beats.length<=2){ title="One thing came back"; ep=live.length+" loose end"+(live.length>1?"s":"");
    fin="Survivable. You have had worse. You will have worse this week."; }
  else if(beats.length<=4){ title="It all landed at once"; ep=live.length+" loose ends · "+combos.length+" collision"+(combos.length===1?"":"s");
    fin="This is the shape of the thing. Four small conveniences at nine in the morning, one large public accounting at ten."; }
  else { title="A catastrophe of your own careful construction"; ep=live.length+" loose ends · "+combos.length+" collisions";
    fin="Every single one of these was the easy option at the time. That is what they have in common. That is the only thing they have in common."; }

  var h='<div class="ep">'+ep+(hot.length?" · "+hot.length+" doubled down":"")+'</div><h2>'+title+'</h2>';
  if(!beats.length) h+='<div class="beat">Nothing happens. It is almost eerie.</div>';
  beats.forEach(function(b){
    h+='<div class="beat'+(b.t==="combo"?" combo":"")+'">'+(b.t==="combo"?'<span class="cl">two of them meet</span>':"")+b.text+'</div>';
  });
  h+='<p class="fin">'+fin+'</p><button class="big go" id="b-again">Another morning</button>';
  document.getElementById("mb").innerHTML=h;
  setTimeout(function(){ document.getElementById("modal").classList.add("open"); },1400);
  setTimeout(function(){ document.getElementById("b-again").addEventListener("click",reset); },0);
}

reset();
window.__p2={state:function(){return G;},finale:finale};
})();
</script>
