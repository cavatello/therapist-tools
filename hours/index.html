<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>hours — design document</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%2316211B' stroke-width='9' stroke-linecap='round' stroke-dasharray='113 32' transform='rotate(-64 32 32)'/%3E%3Ccircle cx='32' cy='9' r='7' fill='%23D9932B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Fraunces:opsz,wght@9..144,500;9..144,700;9..144,900&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#16211B;--ink-2:#3E4B44;--ink-3:#6B7972;--paper:#FBF7EE;--paper-2:#F3EDE0;--line:#DED5C2;
--green:#1F6B4B;--green-s:#E3F0E7;--amber:#D9932B;--amber-s:#FBEED6;--coral:#C4483A;--coral-s:#FBE4E0;
--violet:#5B4BD6;--violet-s:#E9E6FB;--sh:4px 4px 0 var(--ink);--sh2:2px 2px 0 var(--ink)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:'Inter Tight',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4,.wm{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;letter-spacing:-.032em;line-height:1.05}
code,.mono{font-family:'IBM Plex Mono',monospace}
.wrap{max-width:1080px;margin:0 auto;padding:0 26px}
a{color:var(--green)}

/* ---------- gate ---------- */
#gate{position:fixed;inset:0;background:var(--ink);color:#F7F3E9;display:grid;place-items:center;z-index:999;padding:26px}
#gate .box{max-width:430px;width:100%;text-align:center}
#gate svg{width:60px;height:60px;margin-bottom:22px}
#gate h1{font-size:31px;color:#fff;margin-bottom:9px}
#gate p{font-size:15px;opacity:.62;margin-bottom:22px;line-height:1.5}
#gate input{width:100%;padding:14px 16px;border-radius:11px;border:2px solid rgba(255,255,255,.25);
background:rgba(255,255,255,.06);color:#fff;font-size:16px;font-family:'IBM Plex Mono';text-align:center}
#gate input:focus{outline:none;border-color:var(--amber)}
#gate button{margin-top:12px;width:100%;padding:14px;border-radius:11px;border:0;background:var(--amber);
color:var(--ink);font-size:16px;font-weight:700;font-family:inherit;cursor:pointer}
#gate .err{color:#F2A79B;font-size:14px;margin-top:13px;min-height:20px}
#doc{display:none}


/* ---------- gallery ---------- */
.gbtn{background:var(--ink);color:var(--paper);border:0;border-radius:7px;padding:5px 12px;font-size:12.5px;
font-weight:700;font-family:inherit;cursor:pointer;white-space:nowrap;margin-left:auto}
#gal{position:fixed;inset:0;background:var(--paper);z-index:200;overflow-y:auto;display:none}
#gal.on{display:block}
.galbar{position:sticky;top:0;z-index:5;background:rgba(251,247,238,.97);backdrop-filter:blur(9px);
border-bottom:2px solid var(--ink);padding:14px 0}
.galbar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.galbar h3{font-size:20px;margin-right:8px}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:6px 14px;font-size:13px;
font-weight:600;cursor:pointer;font-family:inherit;color:var(--ink-2)}
.fchip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.gclose{background:none;border:0;font-size:26px;cursor:pointer;color:var(--ink-3);line-height:1;padding:0 4px;margin-left:auto}
.ghint{font-size:12.5px;color:var(--ink-3);width:100%;margin-top:2px}
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:18px;padding:22px 0 70px}
.gcard{border:2px solid var(--ink);border-radius:14px;background:#fff;overflow:hidden;box-shadow:var(--sh2);
cursor:pointer;transition:transform .12s}
.gcard:hover{transform:translateY(-3px)}
.gcard.sel{outline:4px solid var(--amber);outline-offset:2px}
.gshot{height:236px;overflow:hidden;border-bottom:2px solid var(--ink);background:var(--paper-2);position:relative}
.gshot iframe{width:1280px;height:900px;border:0;transform:scale(.28);transform-origin:top left;
pointer-events:none;display:block}
.gshot .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-3);font-size:13px}
.gmeta{padding:13px 15px}
.gmeta b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:16.5px;margin-bottom:4px}
.gmeta p{font-size:13px;color:var(--ink-2);margin-bottom:9px;min-height:34px}
.gfoot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.gstat{font-size:10px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.gstat.rec{background:var(--green);color:#fff}
.gstat.app{background:var(--violet-s);color:#3B2FA6}
.gstat.strat{background:var(--amber-s);color:#8A5A0C}
.gstat.brand{background:var(--paper-2);color:var(--ink-2)}
.gopen{margin-left:auto;font-size:12px;color:var(--green);font-weight:600}
/* compare */
#cmp{position:fixed;inset:0;background:var(--ink);z-index:300;display:none;flex-direction:column}
#cmp.on{display:flex}
.cbar{padding:12px 20px;display:flex;gap:14px;align-items:center;color:#F7F3E9;font-size:13.5px;flex-wrap:wrap}
.cbar b{font-size:15px}
.cpanes{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#000;min-height:0}
.cpane{background:#fff;display:flex;flex-direction:column;min-height:0}
.cpane .ct{background:var(--paper-2);border-bottom:2px solid var(--ink);padding:9px 14px;font-size:13px;font-weight:700}
.cpane iframe{flex:1;width:100%;border:0}
@media(max-width:820px){.cpanes{grid-template-columns:1fr}.gshot{height:190px}.gshot iframe{transform:scale(.225)}}

/* ---------- cover ---------- */
.cover{background:var(--ink);color:#F7F3E9;padding:44px 0 52px;border-bottom:4px solid var(--amber)}
.lockup{display:flex;align-items:center;gap:15px;margin-bottom:46px}
.lockup .glyph{width:44px;height:44px;flex:0 0 auto}
.wm{font-size:31px;color:#fff;line-height:1}
.wmsub{font-size:12px;opacity:.5;letter-spacing:.04em;margin-top:3px}
.cover h1{font-size:clamp(33px,5.4vw,55px);color:#fff;max-width:19ch;margin-bottom:20px}
.lede{font-size:19px;opacity:.78;max-width:60ch;margin-bottom:38px}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;border-top:1px solid rgba(255,255,255,.18);
border-bottom:1px solid rgba(255,255,255,.18);padding:20px 0;margin-bottom:22px}
.statstrip b{display:block;font-family:'Fraunces';font-weight:900;font-size:29px;color:#fff;line-height:1}
.statstrip span{display:block;font-size:12.5px;opacity:.55;margin-top:5px}
.meta{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;opacity:.6}
.meta .warn{color:var(--amber);opacity:1;font-weight:600}

/* ---------- nav ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(251,247,238,.95);backdrop-filter:blur(9px);
border-bottom:2px solid var(--ink)}
nav .wrap{display:flex;gap:5px;overflow-x:auto;padding-top:9px;padding-bottom:9px;scrollbar-width:none}
nav .wrap::-webkit-scrollbar{display:none}
nav a{font-size:12.5px;font-weight:600;color:var(--ink-2);text-decoration:none;padding:5px 11px;
border-radius:7px;white-space:nowrap}
nav a:hover{background:var(--paper-2)}
nav a.on{background:var(--ink);color:var(--paper)}

/* ---------- sections ---------- */
section{padding:64px 0 10px;scroll-margin-top:60px}
.sh{display:flex;align-items:baseline;gap:15px;flex-wrap:wrap;border-top:3px solid var(--ink);
padding-top:14px;margin-bottom:24px}
.sn{font-family:'Fraunces';font-weight:900;font-size:15px;color:var(--amber)}
.sh h2{font-size:clamp(26px,3.6vw,37px)}
.sk{font-size:13px;color:var(--ink-3);margin-left:auto}
h3{font-size:21px;margin:36px 0 14px}
.body{font-size:16.5px;color:var(--ink-2);max-width:74ch;margin-bottom:14px}
.body b{color:var(--ink);font-weight:600}
.cap{font-size:13.5px;color:var(--ink-3);max-width:78ch;margin:12px 0 0}
.cap b{color:var(--ink-2);font-weight:600}
.pull{font-family:'Bricolage Grotesque';font-weight:700;font-size:clamp(20px,2.7vw,27px);line-height:1.28;
letter-spacing:-.02em;border-left:5px solid var(--amber);padding:4px 0 4px 22px;margin:20px 0 30px;max-width:34ch}
.pull.sm{font-size:clamp(18px,2.2vw,22px);max-width:44ch}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.claim{border:2px solid var(--ink);border-radius:13px;padding:16px;background:#fff;box-shadow:var(--sh2)}
.claim b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:16.5px;margin-bottom:7px}
.claim p{font-size:13.8px;color:var(--ink-2)}
.claim em{font-style:normal;color:var(--ink);font-weight:600}
.buyer{border:2px solid var(--line);border-radius:13px;padding:17px;background:#fff}
.buyer.hot{border-color:var(--ink);box-shadow:var(--sh2)}
.buyer b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;margin:8px 0 7px}
.buyer p{font-size:14px;color:var(--ink-2)}
.tag{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.tag.grey{background:var(--paper-2);color:var(--ink-3)}
.tag.coral{background:var(--coral-s);color:#8E2E23}
.tag.violet{background:var(--violet-s);color:#3B2FA6}

.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
.quotes blockquote{background:#fff;border:1.5px solid var(--line);border-left:4px solid var(--coral);
border-radius:10px;padding:14px 15px;font-size:14.5px;color:var(--ink-2);font-style:italic}
.insight{border:2px solid var(--ink);border-radius:14px;background:var(--paper-2);padding:20px 22px;margin:22px 0;box-shadow:var(--sh2)}
.insight b{font-family:'Bricolage Grotesque';font-weight:800;font-size:18px;display:block;margin-bottom:9px}
.insight p{font-size:15.5px;color:var(--ink-2);max-width:76ch}
.insight p b{display:inline;font-family:inherit;font-size:inherit;color:var(--ink);font-weight:600}
.warnbox{border:2px solid var(--amber);background:var(--amber-s);border-radius:13px;padding:17px 19px;margin:18px 0}
.warnbox b{font-size:16px;display:block;margin-bottom:7px}
.warnbox p{font-size:15px;color:var(--ink-2);max-width:76ch}

.nums .num{border:2px solid var(--ink);border-radius:12px;padding:15px;background:#fff;text-align:center}
.nums .num b{display:block;font-family:'Fraunces';font-weight:900;font-size:27px;line-height:1}
.nums .num span{display:block;font-size:12px;color:var(--ink-3);margin-top:5px}
.nums .num.tot{background:var(--ink);color:var(--paper)}
.nums .num.tot span{color:rgba(255,255,255,.6)}

table.t{width:100%;border-collapse:collapse;font-size:14.5px;margin:8px 0;display:table}
table.t th{text-align:left;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
color:var(--ink-3);padding:0 10px 8px;border-bottom:2px solid var(--ink)}
table.t td{padding:11px 10px;border-bottom:1.5px solid var(--line);vertical-align:top;color:var(--ink-2)}
table.t td b{color:var(--ink)}
.tscroll{overflow-x:auto}
.pill{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;
border-radius:5px;margin-right:6px;white-space:nowrap}
.pill.ok{background:var(--green-s);color:#12523A}.pill.warn{background:var(--amber-s);color:#8A5A0C}
.pill.bad{background:var(--coral-s);color:#8E2E23}
table.voice td:first-child{color:#8E2E23}table.voice td:last-child{color:#12523A;font-weight:500}

.ladder{display:grid;gap:12px;margin:18px 0}
.rung{border:2px solid var(--line);border-radius:13px;padding:17px 19px;background:#fff;position:relative}
.rung.r2{border-color:var(--ink-3)}.rung.r3{border-color:var(--amber);background:var(--amber-s)}
.rung.r4{border-color:var(--violet);background:var(--violet-s);box-shadow:var(--sh2)}
.lv{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:5px}
.rung b{font-family:'Bricolage Grotesque';font-weight:800;font-size:17.5px;display:block;margin-bottom:8px}
.rung p{font-size:14.5px;color:var(--ink-2);max-width:82ch;margin-bottom:8px}
.rung p:last-child{margin-bottom:0}

.mods{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.mod{border:2px solid var(--ink);border-radius:13px;padding:16px;background:#fff;box-shadow:var(--sh2)}
.mod b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:16.5px;margin:8px 0 7px}
.mod p{font-size:13.8px;color:var(--ink-2)}
.badge{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px}
.badge.green{background:var(--green-s);color:#12523A}.badge.violet{background:var(--violet-s);color:#3B2FA6}
.badge.amber{background:var(--amber-s);color:#8A5A0C}.badge.coral{background:var(--coral-s);color:#8E2E23}
.badge.grey{background:var(--paper-2);color:var(--ink-3)}

/* ---------- screens ---------- */
.screens{display:grid;gap:26px}
.scr{border:2px solid var(--ink);border-radius:16px;background:#fff;overflow:hidden;box-shadow:var(--sh)}
.scr figcaption{padding:17px 19px 14px}
.scr figcaption b{font-family:'Bricolage Grotesque';font-weight:800;font-size:20px;display:block;margin:6px 0 6px}
.scr figcaption p{font-size:14.5px;color:var(--ink-2);max-width:80ch}
.tagn{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;background:var(--amber);
color:var(--ink);padding:3px 8px;border-radius:5px}
.frame{height:520px;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--paper-2)}
.frame iframe{width:100%;height:100%;border:0;display:block}
.fbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 19px;background:var(--paper-2)}
.fbar code{font-size:12px;color:var(--ink-3)}
.fbar button{background:var(--ink);color:var(--paper);border:0;border-radius:7px;padding:7px 14px;
font-size:13px;font-weight:600;font-family:inherit;cursor:pointer}

/* ---------- brand ---------- */
.logos{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}
.logo{border:2px solid var(--line);border-radius:14px;padding:19px;background:#fff;position:relative}
.logo.pick{border-color:var(--ink);box-shadow:var(--sh)}
.logo .rec{position:absolute;top:-11px;right:16px;background:var(--green);color:#fff;font-size:10px;font-weight:800;
letter-spacing:.09em;text-transform:uppercase;padding:4px 10px;border-radius:6px}
.logo .art{height:110px;display:grid;place-items:center;background:var(--paper);border-radius:11px;margin-bottom:14px}
.logo .art svg{width:76px;height:76px}
.logo b{font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;display:block;margin-bottom:7px}
.logo p{font-size:14px;color:var(--ink-2)}
.lockdemo{display:flex;gap:15px;flex-wrap:wrap;align-items:center;margin:16px 0}
.lk{border:2px solid var(--line);border-radius:13px;padding:22px 26px;background:#fff;display:flex;
flex-direction:column;gap:3px;align-items:flex-start}
.lk-dark{background:var(--ink);border-color:var(--ink);color:#F7F3E9}
.lkw{font-family:'Bricolage Grotesque';font-weight:800;letter-spacing:-.045em;display:inline-flex;align-items:center;line-height:1}
.lk-lg .lkw{font-size:52px}.lk-sm .lkw,.lk-dark .lkw{font-size:33px}
.lkw .o{height:.72em;width:.72em;margin:0 .01em}
.lkp{font-size:11.5px;color:var(--ink-3);letter-spacing:.04em}
.favs{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#fff;border:2px solid var(--line);
border-radius:12px;padding:15px 19px;margin-top:6px;font-size:13px;color:var(--ink-3)}
.f32{width:32px;height:32px}.f24{width:24px;height:24px}.f16{width:16px;height:16px}
.fn{margin-left:6px}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:14px 0}
.sw{border-radius:11px;padding:15px 13px;min-height:88px;display:flex;flex-direction:column;justify-content:flex-end;
border:1.5px solid var(--line)}
.sw b{font-size:13px;display:block}.sw span{font-family:'IBM Plex Mono';font-size:11px;opacity:.7}
.typ{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:14px 0}
.typ>div{border:1.5px solid var(--line);border-radius:11px;padding:15px;background:#fff}
.typ b{display:block;font-size:25px;margin-bottom:5px}
.typ span{font-size:13px;color:var(--ink-2)}
.tf1{font-family:'Bricolage Grotesque';font-weight:800}.tf2{font-family:'Inter Tight';font-weight:600}
.tf3{font-family:'Fraunces';font-weight:900}.tf4{font-family:'IBM Plex Mono';font-weight:600;font-size:21px!important}

/* ---------- marketing ---------- */
.ctacompare{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.ctacompare>div{border:2px solid var(--line);border-radius:13px;padding:17px;background:#fff}
.ctacompare .new{border-color:var(--green);background:var(--green-s);box-shadow:var(--sh2)}
.ctacompare span{font-size:10px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.ctacompare b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;margin:6px 0 7px}
.ctacompare .old b{text-decoration:line-through;opacity:.5}
.ctacompare p{font-size:14px;color:var(--ink-2)}
.pricecard{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:14px 0}
.pc{border:2px solid var(--ink);border-radius:14px;padding:19px;background:#fff}
.pc.feat{background:var(--ink);color:var(--paper);box-shadow:var(--sh)}
.pc>b{font-size:14px;font-weight:600;display:block;opacity:.7}
.amt{font-family:'Fraunces';font-weight:900;font-size:41px;line-height:1;margin:7px 0 14px}
.amt span{font-family:'Inter Tight';font-size:15px;font-weight:400;opacity:.6}
.pc ul{list-style:none}
.pc li{font-size:13.8px;padding:6px 0 6px 17px;position:relative;border-bottom:1px dashed var(--line)}
.pc.feat li{border-color:rgba(255,255,255,.16)}
.pc li:last-child{border-bottom:0}
.pc li:before{content:'·';position:absolute;left:4px;font-weight:800}
.pitchbox{border:2px solid var(--green);background:var(--green-s);border-radius:14px;padding:20px 22px;margin:14px 0}
.pitchbox p{font-size:15.5px;color:var(--ink-2);max-width:78ch;margin-bottom:11px}
.pitchbox p:last-child{margin-bottom:0}
.pitchbox b{color:var(--ink)}

/* ---------- plan ---------- */
.phases{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.ph{border:2px solid var(--ink);border-radius:13px;padding:16px;background:#fff;box-shadow:var(--sh2)}
.ph.big{background:var(--violet-s);border-color:var(--violet)}
.pn{font-family:'Fraunces';font-weight:900;font-size:12px;color:var(--amber);letter-spacing:.04em}
.ph b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:16.5px;margin:4px 0 9px}
.ph ul{list-style:none}
.ph li{font-size:13.5px;color:var(--ink-2);padding:5px 0 5px 15px;position:relative;border-bottom:1px dashed var(--line)}
.ph li:last-child{border-bottom:0}
.ph li:before{content:'·';position:absolute;left:3px;font-weight:800}

/* ---------- decisions / todo / wrongs ---------- */
.decs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.dec{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;
padding:11px 13px;background:#fff;font-size:14px}
.dec .st{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
padding:3px 7px;border-radius:5px;margin-top:2px}
.dec .st.ok{background:var(--green-s);color:#12523A}
.dec .st.no{background:var(--coral-s);color:#8E2E23}
.dec b{display:block;font-weight:600;margin-bottom:1px}
.dec span{color:var(--ink-2);font-size:13.3px}

.todo{display:grid;gap:11px}
.td{border:2px solid var(--line);border-radius:12px;padding:16px 18px;background:#fff;display:grid;
grid-template-columns:auto 1fr;gap:14px;align-items:start}
.td.crit{border-color:var(--coral);background:#FDF4F2}
.td.high{border-color:var(--amber)}
.td .lvl{font-size:9.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;padding:4px 8px;
border-radius:5px;white-space:nowrap}
.lvl.crit{background:var(--coral);color:#fff}.lvl.high{background:var(--amber);color:var(--ink)}
.lvl.med{background:var(--paper-2);color:var(--ink-2)}.lvl.watch{background:var(--violet-s);color:#3B2FA6}
.td b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:17px;margin-bottom:6px}
.td .blk{font-size:14.3px;color:var(--ink-2);margin-bottom:8px}
.td .cost{font-size:13px;color:var(--ink-3);border-top:1.5px solid var(--line);padding-top:8px}
.td .cost em{font-style:normal;font-weight:700;color:var(--ink-2)}

.wrongs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wr{border:1.5px solid var(--line);border-radius:11px;padding:13px 15px;background:#fff}
.wr .a{font-size:14px;color:#8E2E23;font-weight:600;margin-bottom:5px}
.wr .a:before{content:'✕ ';font-weight:800}
.wr .b2{font-size:13.8px;color:var(--ink-2)}
.wr .b2:before{content:'→ ';color:var(--green);font-weight:800}
.trap{border:2px solid var(--coral);background:var(--coral-s);border-radius:12px;padding:15px 17px}
.trap b{display:block;font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;margin-bottom:6px}
.trap p{font-size:14px;color:var(--ink-2)}

.proto{border:2px solid var(--ink);border-radius:14px;padding:20px 24px;background:#fff;box-shadow:var(--sh2)}
.proto ol{list-style:none;counter-reset:p}
.proto li{counter-increment:p;font-size:15px;color:var(--ink-2);padding:10px 0 10px 34px;position:relative;
border-bottom:1.5px solid var(--line)}
.proto li:last-child{border-bottom:0}
.proto li:before{content:counter(p);position:absolute;left:0;top:11px;width:23px;height:23px;border-radius:50%;
background:var(--ink);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center}
.proto li b{color:var(--ink)}
.changelog{margin-top:34px}
.cl{display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1.5px solid var(--line);font-size:14.3px;color:var(--ink-2)}
.cl .v{font-family:'Fraunces';font-weight:900;font-size:15px;flex:0 0 46px}
.cl .d{font-size:12px;color:var(--ink-3);flex:0 0 54px}
.foot{border-top:3px solid var(--ink);margin-top:56px;padding:30px 0 70px}
.foot p{font-size:13px;color:var(--ink-3);margin-top:14px}
.foot .lk{border:0;padding:0;background:none}

@media(max-width:900px){
 .g4,.g3,.g2,.mods,.quotes,.phases,.pricecard,.logos,.decs,.wrongs,.ctacompare,.typ{grid-template-columns:1fr}
 .statstrip{grid-template-columns:1fr 1fr}
 .pal{grid-template-columns:1fr 1fr 1fr}
 .frame{height:400px}
 .td{grid-template-columns:1fr}
 table.t{font-size:13.5px;display:block;overflow-x:auto;white-space:nowrap}
 table.t td,table.t th{white-space:normal;min-width:150px}
 .pull{padding-left:16px}
 .lk-lg .lkw{font-size:40px}
 .sk{margin-left:0;width:100%}
}
</style>
</head>

<script>
const SALT="ljZw6cR4CMw2ZEXxYbO9YA==", IV="kVauTSx9xgXqewTo", ITER=600000;
function b64(s){const r=atob(s),a=new Uint8Array(r.length);for(let i=0;i<r.length;i++)a[i]=r.charCodeAt(i);return a;}
async function unlock(){
  const pw=document.getElementById('pw').value, err=document.getElementById('err');
  if(!pw)return; err.textContent='Decrypting…';
  try{
    const enc=new TextEncoder();
    const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(SALT),iterations:ITER,hash:'SHA-256'},
      km,{name:'AES-GCM',length:256},false,['decrypt']);
    const ct=b64(document.getElementById('payload').textContent.trim());
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(IV)},key,ct);
    const ds=new DecompressionStream('gzip');
    const txt=await new Response(new Blob([plain]).stream().pipeThrough(ds)).text();
    render(JSON.parse(txt));
  }catch(e){ err.textContent='That passphrase didn’t work.'; }
}
document.getElementById('go').addEventListener('click',unlock);
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
document.getElementById('pw').focus();

function render(B){
  document.getElementById('gate').remove();
  const doc=document.getElementById('doc');
  doc.innerHTML=B.html; doc.style.display='block';

  // data-driven blocks
  const D=B.data;
  document.getElementById('decs').innerHTML=D.decisions.map(d=>
    '<div class="dec"><span class="st '+d[2]+'">'+(d[2]==='no'?'Not doing':'Locked')+'</span>'+
    '<div><b>'+d[0]+'</b><span>'+d[1]+'</span></div></div>').join('');
  document.getElementById('todo').innerHTML=D.todo.map(t=>
    '<div class="td '+t[1]+'"><span class="lvl '+t[1]+'">'+
    ({crit:'Blocking',high:'Soon',med:'When convenient',watch:'Instrument'})[t[1]]+'</span>'+
    '<div><b>'+t[0]+'</b><div class="blk">'+t[2]+'</div>'+
    '<div class="cost"><em>To resolve:</em> '+t[3]+'</div></div></div>').join('');
  document.getElementById('wrongs').innerHTML=D.wrongs.map(w=>
    '<div class="wr"><div class="a">'+w[0]+'</div><div class="b2">'+w[1]+'</div></div>').join('');
  document.getElementById('chg').innerHTML=D.changelog.map(c=>
    '<div class="cl"><span class="v">'+c[0]+'</span><span class="d">'+c[1]+'</span><span>'+c[2]+'</span></div>').join('');

  // mockups
  document.querySelectorAll('.scr').forEach(function(fig){
    const k=fig.dataset.k, src=B.mockups[k];
    if(!src)return;
    fig.querySelector('iframe').srcdoc=src;
    fig.querySelector('.open').addEventListener('click',function(){
      const u=URL.createObjectURL(new Blob([src],{type:'text/html'}));
      window.open(u,'_blank');
    });
  });


  // ---------- gallery ----------
  var GAL=D.gallery||[], selected=[], cmpOn=false;
  var navWrap=document.querySelector('nav .wrap');
  if(navWrap){var gb=document.createElement('button');gb.className='gbtn';gb.textContent='⊞ Gallery';
    gb.onclick=openGal;navWrap.appendChild(gb);}

  function card(g){
    return '<div class="gcard" data-k="'+g[0]+'" data-cat="'+g[3]+'">'+
      '<div class="gshot"><div class="ph">loading…</div></div>'+
      '<div class="gmeta"><b>'+g[1]+'</b><p>'+g[2]+'</p>'+
      '<div class="gfoot"><span class="gstat '+g[3]+'">'+g[4]+'</span>'+
      '<span class="gopen">open ↗</span></div></div></div>';
  }
  document.getElementById('ggrid').innerHTML=GAL.map(card).join('');

  // lazy-fill previews
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var el=e.target, k=el.dataset.k, src=B.mockups[k];
      if(src && !el.dataset.done){
        el.dataset.done='1';
        var f=document.createElement('iframe'); f.setAttribute('title',k); f.srcdoc=src;
        var shot=el.querySelector('.gshot'); shot.innerHTML=''; shot.appendChild(f);
      }
      io.unobserve(el);
    });
  },{rootMargin:'400px'});
  document.querySelectorAll('.gcard').forEach(function(c){ io.observe(c); });

  function openGal(){ document.getElementById('gal').classList.add('on'); document.body.style.overflow='hidden'; }
  function closeGal(){ document.getElementById('gal').classList.remove('on'); document.body.style.overflow=''; }
  document.getElementById('galx').onclick=closeGal;

  document.querySelectorAll('.fchip').forEach(function(b){
    b.onclick=function(){
      if(b.dataset.f==='cmp'){
        cmpOn=!cmpOn; b.classList.toggle('on',cmpOn); selected=[];
        document.querySelectorAll('.gcard').forEach(function(c){c.classList.remove('sel');});
        document.getElementById('ghint').textContent = cmpOn
          ? 'Compare mode — pick any two cards to see them side by side.'
          : 'Click any card to open it full-screen. Live previews — not screenshots.';
        return;
      }
      document.querySelectorAll('.fchip').forEach(function(x){ if(x.dataset.f!=='cmp')x.classList.remove('on'); });
      b.classList.add('on');
      var f=b.dataset.f;
      document.querySelectorAll('.gcard').forEach(function(c){
        c.style.display=(f==='all'||c.dataset.cat===f)?'':'none'; });
    };
  });

  document.getElementById('ggrid').addEventListener('click',function(e){
    var c=e.target.closest('.gcard'); if(!c)return;
    var k=c.dataset.k, src=B.mockups[k]; if(!src)return;
    if(cmpOn){
      var i=selected.indexOf(k);
      if(i>-1){selected.splice(i,1);c.classList.remove('sel');}
      else{selected.push(k);c.classList.add('sel');}
      if(selected.length===2){
        var nm=function(key){var g=GAL.filter(function(x){return x[0]===key;})[0];return g?g[1]:key;};
        document.getElementById('ctA').innerHTML=nm(selected[0]);
        document.getElementById('ctB').innerHTML=nm(selected[1]);
        document.getElementById('cfA').srcdoc=B.mockups[selected[0]];
        document.getElementById('cfB').srcdoc=B.mockups[selected[1]];
        document.getElementById('cmp').classList.add('on');
      }
      return;
    }
    window.open(URL.createObjectURL(new Blob([src],{type:'text/html'})),'_blank');
  });
  document.getElementById('cmpx').onclick=function(){
    document.getElementById('cmp').classList.remove('on');
    selected=[]; document.querySelectorAll('.gcard').forEach(function(c){c.classList.remove('sel');});
  };
  addEventListener('keydown',function(e){
    if(e.key!=='Escape')return;
    if(document.getElementById('cmp').classList.contains('on')){document.getElementById('cmpx').click();}
    else if(document.getElementById('gal').classList.contains('on')){closeGal();}
  });

  // scroll spy
  const links=[].slice.call(document.querySelectorAll('nav a'));
  const secs=links.map(a=>document.querySelector(a.getAttribute('href')));
  function spy(){let y=scrollY+130,i=0;secs.forEach((s,n)=>{if(s&&s.offsetTop<=y)i=n;});
    links.forEach((a,n)=>a.classList.toggle('on',n===i));}
  addEventListener('scroll',spy,{passive:true});spy();
  document.title='hours — design document v2.3';
}
</script>
</body>
</html>
