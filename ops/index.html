    return crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  }).then(function(buf){
    document.open();document.write(new TextDecoder().decode(buf));document.close();
  }).catch(function(){
    e.textContent='Wrong passphrase.';
  });
});
</script></body></html>
