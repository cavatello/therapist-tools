(function(){
  if (typeof window === 'undefined') return;
  // gtag may not have loaded yet, or may be blocked. Queue into dataLayer the
  // way the snippet itself does, so a blocked loader costs the event and not
  // the page.
  function send(name, params){
    try {
      window.dataLayer = window.dataLayer || [];
      if (typeof window.gtag === 'function') { window.gtag('event', name, params); }
      else { window.dataLayer.push(['event', name, params]); }
    } catch (e) {}
  }

  // Where on the page the form sat. Two signup forms on one page are the same
  // event with different placements, and the placement is the thing worth
  // knowing: a footer form and a hero form convert nothing like each other.
  function place(form){
    if (form.classList.contains('hero')) return 'hero';
    var s = form.closest('footer, .sitefoot, .lnews, .nlband, section, main');
    if (!s) return 'unknown';
    if (s.tagName === 'FOOTER' || s.classList.contains('sitefoot')) return 'footer';
    return s.id || (s.className || '').split(/\s+/)[0] || 'body';
  }

  function kindOf(form){
    return form.dataset.kind === 'contact' ? 'contact' : 'newsletter';
  }

  function base(form){
    var c = form.querySelector('input[type=checkbox][name=consent]');
    return {
      form_location: place(form),
      form_id: form.className || 'form',
      consent_given: c ? !!c.checked : null,
      page_path: location.pathname
    };
  }

  document.addEventListener('submit', function(e){
    var f = e.target;
    if (!f || f.tagName !== 'FORM') return;
    if (!f.querySelector('input[type=email]')) return;
    var kind = kindOf(f);
    f.dataset.tsSent = '1';
    send(kind === 'contact' ? 'contact_submit' : 'newsletter_submit', base(f));
  }, true);

  // The confirmation the page's own handler writes on a successful POST. Only
  // this fires the conversion.
  function confirmed(node){
    var f = node.closest ? node.closest('form') : null;
    if (!f) {
      // The handler replaces the form with the notice on some templates, so
      // fall back to the nearest form-ish ancestor's own dataset.
      f = node.parentElement && node.parentElement.querySelector
          ? node.parentElement.querySelector('form') : null;
    }
    var kind = f ? kindOf(f) : (node.dataset.kind || 'newsletter');
    var p = f ? base(f) : {form_location: 'unknown', page_path: location.pathname};
    if (kind === 'contact') {
      send('contact_sent', p);
      send('generate_lead', p);
      return;
    }
    send('newsletter_signup', p);
    send('generate_lead', p);   // GA4's own recommended name, for the standard reports
  }

    muts.forEach(function(m){

        }

   first shipped version of this pass. Doubled selector so the shape's own
   colour outranks whatever the page brought with it. */
.ig-split.ig-split .seg.a .n{color:#fff}
.ig-split.ig-split .seg.b .n{color:#1B2420}

/* ---------------------------------------------------------------- steps */
.ig-steps ol{list-style:none;margin:0;padding:0;counter-reset:s}
.ig-steps li{counter-increment:s;position:relative;display:grid;
  grid-template-columns:38px 1fr;gap:13px;align-items:start;
  padding:0 0 16px;margin:0}
.ig-steps li::before{content:counter(s,decimal-leading-zero);
  font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;
  display:flex;align-items:center;justify-content:center;
  width:34px;height:34px;border:2px solid #1B2420;border-radius:9px;
  background:#FFE7A3;color:#1B2420;box-shadow:2px 2px 0 #1B2420}
/* the connector between steps, decorative only */
.ig-steps li:not(:last-child)::after{content:"";position:absolute;
  left:17px;top:38px;bottom:4px;width:2px;background:#D9D0BA}
/* `li::before` IS a grid item. Without an explicit column the auto-flow puts
   the number in 1/1, the title in 2/1 and then wraps the description back to
   1/2 - the 38px column - which renders one character per line and made a
   seven-step list 4,170px tall. Both children are pinned to column 2. */
.ig-steps li > b,.ig-steps li > span{grid-column:2}
.ig-steps b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;
  font-weight:800;letter-spacing:-.02em;font-size:15.5px;color:#1B2420;
  margin:6px 0 3px}
.ig-steps span{display:block;font-size:14px;line-height:1.6;color:#5F6A64;max-width:64ch}

/* ----------------------------------------------------------------- bars */
.ig-bars .row{display:grid;grid-template-columns:150px 1fr auto;gap:12px;
  align-items:center;padding:7px 0;border-bottom:1.5px solid #DFE4E0}
.ig-bars .row:last-child{border-bottom:0}
.ig-bars .who{font-size:13.6px;line-height:1.35;color:#1B2420;font-weight:600}
.ig-bars.ig-bars .who i{display:block;font-style:normal;font-size:11.5px;
  color:#5F6A64;font-weight:400}
.ig-bars .track{background:#F4F0E6;border:1.5px solid #D9D0BA;border-radius:999px;
  height:19px;position:relative;overflow:hidden}
.ig-bars .fill{position:absolute;left:0;top:0;bottom:0;background:#2C6350;
  border-radius:999px}
.ig-bars .fill.lo{background:#DFE4E0}
.ig-bars.ig-bars .val{font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:15px;color:#1B2420;white-space:nowrap}

/* ----------------------------------------------------------------- flow */
.ig-flow .fr{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}
.ig-flow .node{flex:1 1 150px;border:2px solid #1B2420;border-radius:11px;
  background:#F6F8F6;padding:13px 14px;box-shadow:4px 4px 0 #1B2420;min-width:0}
.ig-flow .node.pay{background:#FFE7A3}
.ig-flow .node b{display:block;font-family:'Bricolage Grotesque',system-ui,sans-serif;
  font-weight:800;font-size:14.5px;color:#1B2420;letter-spacing:-.02em}
.ig-flow .node span{display:block;font-size:12.6px;line-height:1.55;color:#5F6A64;
  margin-top:4px}
.ig-flow .arr{flex:0 0 42px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:3px;padding:0 4px}
.ig-flow .arr em{font-style:normal;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#2C6350;
  text-align:center;line-height:1.2}
.ig-flow .arr i{font-style:normal;font-size:19px;color:#1B2420;line-height:1}

/* ----------------------------------------------------------------- stat */
.ig-stat .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:0;border:2px solid #1B2420;border-radius:12px;overflow:hidden;
  box-shadow:5px 5px 0 #1B2420;background:#1B2420}
.ig-stat .c{background:#F6F8F6;padding:14px 15px}
.ig-stat.ig-stat .c .n{display:block;font-family:Fraunces,Georgia,serif;
  font-weight:600;font-size:27px;line-height:1;color:#1B2420;letter-spacing:-.02em}
.ig-stat .l{display:block;font-family:'IBM Plex Mono',ui-monospace,monospace;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#2C6350;
  margin-top:7px;line-height:1.5}

@media (max-width:640px){
  .ig{padding:15px 16px}
  .ig-bars .row{grid-template-columns:1fr auto;gap:6px 10px}
  .ig-bars .track{grid-column:1 / -1;order:3}
  /* Rotating the whole arrow cell turned its LABEL on its side too, which
     read as a vertical strip of letters beside the flow. Only the glyph
     turns; the label stays horizontal next to it. */
  .ig-flow .arr{flex-basis:100%;height:auto;flex-direction:row;gap:9px;
    justify-content:flex-start;padding:9px 4px}
  .ig-flow .arr i{transform:rotate(90deg);display:block}
  .ig-flow .arr em{text-align:left}
  .ig-split .bar{flex-direction:column}
  .ig-split .seg.b{border-left:0;border-top:2px solid #1B2420}
}
</style>
</body>
</html>
